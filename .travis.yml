language: minimal

services:
  - docker

env:
  - SYMFONY_VERSION=8.0.*
  - SYMFONY_VERSION=8.1.*

install:
  - >-
    docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e COMPOSER_HOME=/tmp/composer
    -e SYMFONY_VERSION -v "$PWD:/app" -w /app ghcr.io/astro-masters/symfony-rr:8.5-dev
    sh -lc 'composer update --with "symfony/config:$SYMFONY_VERSION"
    --with "symfony/dependency-injection:$SYMFONY_VERSION"
    --with "symfony/framework-bundle:$SYMFONY_VERSION"
    --with "symfony/http-client:$SYMFONY_VERSION"
    --with "symfony/http-kernel:$SYMFONY_VERSION"
    --with "symfony/yaml:$SYMFONY_VERSION"
    --no-interaction --prefer-dist --no-progress'

script:
  - docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/app" -w /app ghcr.io/astro-masters/symfony-rr:8.5-dev composer validate --strict --no-check-lock
  - docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/app" -w /app ghcr.io/astro-masters/symfony-rr:8.5-dev composer check-platform-reqs
  - docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/app" -w /app ghcr.io/astro-masters/symfony-rr:8.5-dev php vendor/bin/phpunit -c phpunit.xml.dist
  - docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/app" -w /app ghcr.io/astro-masters/symfony-rr:8.5-dev php vendor/bin/phpstan analyse --no-progress
  - docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/app" -w /app ghcr.io/astro-masters/symfony-rr:8.5-dev php vendor/bin/php-cs-fixer fix --dry-run --using-cache=no
